# Serves the built SPA and proxies the Core admin API on the same origin,
# so the UI can be built with an empty VITE_API_BASE.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not leak the admin token into access logs via query strings; tokens are
    # sent as Authorization headers only, but keep logging minimal anyway.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Security headers. nginx drops server-level add_header in any location that has its own add_header,
    # so the same block is repeated in those locations below.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable once TLS terminates in front of this server:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Optional second fence in front of the application login: uncomment for an IP allowlist and/or Basic Auth.
    # (Core also has ADMIN_ALLOWED_IPS; set TRUST_PROXY=true in Core so it sees the real client IP.)
    location /admin/ {
        # allow 203.0.113.0/24; deny all;
        # auth_basic "gateway"; auth_basic_user_file /etc/nginx/htpasswd;
        proxy_pass http://core:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: a client-supplied X-Forwarded-For must not reach Core (TRUST_PROXY=1 there).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://core:3000/health;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
