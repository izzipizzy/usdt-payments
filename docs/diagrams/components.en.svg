<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1060 420' role='img' aria-label='Where things live and who can do what'>
<rect width='1060' height='420' fill='#ffffff'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='context-stroke'/></marker></defs>
<text x='24' y='30' font-size='16' font-weight='700' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Where things live and who can do what</text>
<rect x='30' y='60' width='400' height='190' rx='12' fill='none' stroke='#7c3aed' stroke-width='1' stroke-dasharray='4 4'/>
<text x='42' y='78' font-size='11' font-weight='600' fill='#7c3aed' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Signer (isolated)</text>
<text x='46' y='100' text-anchor='start' font-size='12' font-weight='400' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>seed phrase and all keys</text>
<text x='46' y='124' text-anchor='start' font-size='12' font-weight='400' fill='#52606d' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>signs only 4 kinds of operations:</text>
<text x='46' y='148' text-anchor='start' font-size='12' font-weight='400' fill='#52606d' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>sweep → main · main → one-time</text>
<text x='46' y='172' text-anchor='start' font-size='12' font-weight='400' fill='#52606d' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>hop → recipient · pool: stake, energy, TRX</text>
<rect x='500' y='60' width='270' height='190' rx='12' fill='none' stroke='#1f2933' stroke-width='1' stroke-dasharray='4 4'/>
<text x='512' y='78' font-size='11' font-weight='600' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>Core (service)</text>
<text x='516' y='100' text-anchor='start' font-size='12' font-weight='400' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>watcher, queues, admin API</text>
<text x='516' y='124' text-anchor='start' font-size='12' font-weight='400' fill='#52606d' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>knows only the public key (xpub)</text>
<text x='516' y='148' text-anchor='start' font-size='12' font-weight='400' fill='#52606d' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>no keys</text>
<rect x='820' y='60' width='220' height='190' rx='12' fill='none' stroke='#1f2933' stroke-width='1' stroke-dasharray='4 4'/>
<text x='832' y='78' font-size='11' font-weight='600' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>PostgreSQL</text>
<text x='836' y='100' text-anchor='start' font-size='12' font-weight='400' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>addresses, deposits, sweeps, payouts</text>
<text x='836' y='124' text-anchor='start' font-size='12' font-weight='400' fill='#52606d' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>settings, audit</text>
<text x='836' y='148' text-anchor='start' font-size='12' font-weight='400' fill='#52606d' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>no keys</text>
<line x1='500' y1='210' x2='430' y2='210' stroke='#7c3aed' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='465.0' y='202.0' text-anchor='middle' font-size='11' fill='#7c3aed' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>sign (token)</text>
<line x1='770' y1='210' x2='820' y2='210' stroke='#7b8794' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='795.0' y='202.0' text-anchor='middle' font-size='11' fill='#7b8794' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>reads/writes</text>
<rect x='500' y='330' width='130' height='50' rx='8' fill='#ffffff' stroke='#1f2933' stroke-width='1.5'/>
<text x='565.0' y='360.0' text-anchor='middle' font-size='13' font-weight='400' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>TRON network</text>
<rect x='690' y='330' width='150' height='50' rx='8' fill='#ffffff' stroke='#1f2933' stroke-width='1.5'/>
<text x='765.0' y='360.0' text-anchor='middle' font-size='13' font-weight='400' fill='#1f2933' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>itrx.io (optional)</text>
<path d='M545,250 L545,330' fill='none' stroke='#7b8794' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='500' y='295' text-anchor='middle' font-size='11' fill='#7b8794' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>blocks, balances</text>
<path d='M600,250 L600,330' fill='none' stroke='#7b8794' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='660' y='295' text-anchor='middle' font-size='11' fill='#7b8794' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>broadcast transactions</text>
<path d='M700,250 L740,330' fill='none' stroke='#7b8794' stroke-width='1.5' marker-end='url(#arrow)'/>
<text x='790' y='295' text-anchor='middle' font-size='11' fill='#7b8794' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'>order energy</text>
</svg>
